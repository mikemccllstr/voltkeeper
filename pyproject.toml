[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluetti-apk-reverse"
version = "0.1.0"
description = "CLI tool for Bluetti power stations — scan, connect, and read data over BLE."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.0.2",
    "click>=8.0",
    "cryptography>=47.0.0",
    "paho-mqtt>=2.0",
    "aiomqtt>=2.0",
    "watchdog>=6.0",
]

[project.scripts]
bluetti-cli = "src.bluetti_cli.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests that exercise real BLE operations (scan, connect)",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["bluetti_cli"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
