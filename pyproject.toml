[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluetti-cli"
version = "0.1.0"
description = "CLI tool for Bluetti power stations — scan, connect, and read data over BLE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak>=3.0.2",
    "click>=8.0",
    "cryptography>=47.0.0",
    "paho-mqtt>=2.0",
    "aiomqtt>=2.0",
    "pyyaml>=6.0",
    "watchdog>=6.0",
]

[project.scripts]
bluetti-cli = "src.bluetti_cli.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration' --cov=src/bluetti_cli --cov-report=term-missing:skip-covered --cov-report=html:htmlcov"
markers = [
    "integration: tests that exercise real BLE operations (scan, connect)",
]

[tool.coverage.run]
branch = true
source = ["src/bluetti_cli"]
omit = ["*/load_test*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["bluetti_cli"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "mypy>=1.13",
]
