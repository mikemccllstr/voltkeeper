[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluetti-cli"
version = "0.1.0"
description = "CLI tool for Bluetti power stations — scan, connect, and read data over BLE."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Michael McCallister", email = "mike@mccllstr.com"},
]
keywords = ["bluetti", "bluetooth", "ble", "power-station", "battery", "solar", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "bleak>=3.0.2",
    "click>=8.0",
    "cryptography>=47.0.0",
    "paho-mqtt>=2.0",
    "aiomqtt>=2.0",
    "pyyaml>=6.0",
    "watchdog>=6.0",
]

[project.urls]
Repository = "https://github.com/mikemccllstr/bluetti-cli"
Issues = "https://github.com/mikemccllstr/bluetti-cli/issues"

[project.scripts]
bluetti-cli = "bluetti_cli.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-m 'not integration' --cov=src/bluetti_cli --cov-report=term-missing:skip-covered --cov-report=html:htmlcov"
markers = [
    "integration: tests that exercise real BLE operations (scan, connect)",
]

[tool.coverage.run]
branch = true
source = ["src/bluetti_cli"]
omit = ["*/load_test*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["bluetti_cli"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "tox>=4.0",
    "tox-uv>=1.0",
]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310, py311, py312, py313, py314
requires = tox-uv>=1.0

[testenv]
commands = pytest --no-cov {posargs}
"""
