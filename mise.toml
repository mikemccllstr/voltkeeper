[tools]
python = "3.14"
ruff = "latest"
uv = "latest"
java = "latest"
"github:skylot/jadx" = "latest"

[tasks.setup]
description = "Install pre-commit hooks"
run = "uv run pre-commit install"

[tasks.lint]
description = "Run ruff linter"
run = "uv run ruff check src/ tests/"

[tasks.format]
description = "Run ruff formatter (apply)"
run = "uv run ruff format src/ tests/"

[tasks.fmt]
description = "Alias for format"
run = "uv run ruff format src/ tests/"

[tasks.format-check]
description = "Check formatting without modifying files (for CI)"
run = "uv run ruff format --check src/ tests/"

[tasks.typecheck]
description = "Run mypy type checker"
run = "uv run mypy src/voltkeeper"

[tasks.test]
description = "Run tests with coverage"
run = "uv run pytest"

[tasks.test-fast]
description = "Run tests without coverage"
run = "uv run pytest --no-cov"

[tasks.coverage]
description = "Run tests and open HTML coverage report"
run = "uv run pytest && open htmlcov/index.html"

[tasks.check]
description = "Run all quality checks (lint + typecheck + test + docs)"
run = [
    "uv run ruff check src/ tests/",
    "uv run mypy src/voltkeeper",
    "uv run pytest",
    "uv run sphinx-lint docs/ README.md",
    "uv run mdformat docs/ README.md --wrap=keep --check",
]

[tasks.test-all]
description = "Run tests across all supported Python versions"
run = "tox run"

[tasks.docs]
description = "Build Sphinx documentation (HTML + man pages)"
run = "uv run sphinx-build -b html docs/source/ docs/build/html/ && uv run sphinx-build -b man docs/source/ docs/build/man/"

[tasks.docs-lint]
description = "Lint docs with sphinx-lint"
run = "uv run sphinx-lint docs/ README.md"

[tasks.docs-format]
description = "Format docs with mdformat (apply)"
run = "uv run mdformat docs/ README.md --wrap=keep"

[tasks.docs-format-check]
description = "Check doc formatting without modifying files (for CI)"
run = "uv run mdformat docs/ README.md --wrap=keep --check"

[tasks.docs-serve]
description = "Build and serve docs locally (default: http://127.0.0.1:3000)"
usage = 'arg "[host]" default="127.0.0.1" help="Bind address"'
depends = ["docs"]
run = "uv run python -m http.server 3000 --bind {{usage.host}} --directory docs/build/html/"

