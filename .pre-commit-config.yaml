repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: mise run lint
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: mise run format
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy typecheck
        entry: mise run typecheck
        language: system
        pass_filenames: false
        always_run: true
