repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pytest>=9.0
          - pytest-asyncio>=1.3
        args: [--ignore-missing-imports, --check-untyped-defs, --no-implicit-optional]
