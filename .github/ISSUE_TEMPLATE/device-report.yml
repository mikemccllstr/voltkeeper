name: Device Report
description: Submit a voltkeeper verify report for a Bluetti device
title: "[Device Report] <model>"
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to submit a voltkeeper verify report for a Bluetti device.
        Your report helps the project confirm which devices work on real hardware.

        Reports produced by `voltkeeper verify` are automatically scrubbed of
        serial numbers and BLE addresses, so you can share them safely.

  - type: input
    id: model
    attributes:
      label: Device model
      description: The model name (e.g. AC2A, EL100V2, EP500)
      placeholder: AC2A
    validations:
      required: true

  - type: input
    id: voltkeeper-version
    attributes:
      label: voltkeeper version
      description: Run `voltkeeper --version` to find it
      placeholder: 1.2.3
    validations:
      required: true

  - type: input
    id: os-adapter
    attributes:
      label: OS and Bluetooth adapter
      description: Operating system, version, and BLE adapter model
      placeholder: Linux (Ubuntu 24.04), built-in Intel AX210
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Device firmware / protocolVer
      description: Firmware version shown on the device display, or the `protocolVer` from the verify report
      placeholder: ARM v6.05 / DSP v1.02
    validations:
      required: true

  - type: textarea
    id: verify-report
    attributes:
      label: Verify report
      description: Paste the full contents of the YAML report produced by `voltkeeper verify`, or attach the `.yaml` file (rename to `.txt` or drag-and-drop). Reports generated by `voltkeeper verify` are already scrubbed of serial numbers and BLE addresses.
    validations:
      required: true

  - type: dropdown
    id: tier-claim
    attributes:
      label: Claimed support tier
      description: Which tier do you believe your results warrant?
      options:
        - "HARDWARE_TESTING — connect, handshake, and live-data parse confirmed on real hardware"
        - "HARDWARE_VERIFIED — verify stages 1–3 pass plus stage 4 under a connected load (stages 5–6 optional)"
    validations:
      required: true

  - type: checkboxes
    id: checklist-followed
    attributes:
      label: Checklist confirmation
      options:
        - label: I followed the [Test your device](https://mikemccllstr.github.io/voltkeeper/user-guide/test-your-device/) walkthrough
          required: true
