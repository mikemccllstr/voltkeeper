name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true      # installs tools from mise.toml (python, uv, ruff)

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: mise run lint

      - name: Format check
        run: mise run format-check

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test
